name: Companion installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'companion-v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: x64
          - target: i686-pc-windows-msvc
            label: x86
    defaults:
      run:
        working-directory: companion
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run tauri -- build --target ${{ matrix.target }}
      - name: Stage stable installer names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" "release/Tarkov-Squad-Planner-Companion_${{ matrix.label }}-setup.exe"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" "release/Tarkov-Squad-Planner-Companion_${{ matrix.label }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: companion-windows-${{ matrix.label }}
          path: companion/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-windows-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
