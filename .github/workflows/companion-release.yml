name: Companion installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'companion-v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: x64
          - target: i686-pc-windows-msvc
            label: x86
    defaults:
      run:
        working-directory: companion
    steps:
      # Immutable refs are pinned to reviewed upstream commits; the rust
      # toolchain commit is recorded below because its stable ref moves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (reviewed 2026-09-01)
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/companion-v')
        shell: pwsh
        run: |
          $configuredVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.Substring('companion-v'.Length)
          if ($tagVersion -ne $configuredVersion) {
            throw "Release tag $env:GITHUB_REF_NAME does not match configured application version $configuredVersion."
          }
      - name: Build signed installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }}
      - name: Stage stable installer names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $nsis = @(Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter "*-setup.exe")
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer for ${{ matrix.label }}, found $($nsis.Count)." }
          $nsisSignature = "$($nsis[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $nsisSignature)) { throw "Missing NSIS signature for ${{ matrix.label }}." }
          $msi = @(Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter "*.msi")
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer for ${{ matrix.label }}, found $($msi.Count)." }
          Copy-Item -LiteralPath $nsis[0].FullName -Destination "release/Tarkov-Squad-Planner-Companion_${{ matrix.label }}-setup.exe"
          Copy-Item -LiteralPath $nsisSignature -Destination "release/Tarkov-Squad-Planner-Companion_${{ matrix.label }}-setup.exe.sig"
          Copy-Item -LiteralPath $msi[0].FullName -Destination "release/Tarkov-Squad-Planner-Companion_${{ matrix.label }}.msi"
          if (-not (Test-Path -LiteralPath "release/Tarkov-Squad-Planner-Companion_${{ matrix.label }}-setup.exe.sig")) { throw "Staged signature is missing for ${{ matrix.label }}." }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: companion-windows-${{ matrix.label }}
          path: companion/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: companion-windows-*
          path: release
          merge-multiple: true
      - name: Generate and validate updater manifest
        run: node scripts/create-companion-manifest.mjs release "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
