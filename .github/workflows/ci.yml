name: CI

on:
  # `main` takes direct commits as well as pull requests, so the gate has to
  # fire on push or it never runs for most of this repository's history.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    env:
      # Smoke tests must construct the Supabase client but never contact a
      # service; Playwright aborts all non-preview requests.
      VITE_SUPABASE_URL: https://smoke.invalid
      VITE_SUPABASE_ANON_KEY: sb_publishable_smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npm run validate:migrations
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  companion-web:
    name: Companion web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  companion-rust:
    name: Companion Rust checks
    runs-on: windows-latest
    env:
      # A runner starts from an empty target directory every time, so
      # incremental artifacts are never reused across runs. They are pure cache
      # weight, and locally they are the largest single thing under
      # target/debug.
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: companion/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cargo fingerprints include the compiler version, so a toolchain bump has
      # to move the key or the job restores a cache it will rebuild anyway.
      - name: Record the toolchain version
        id: rust
        run: |
          $version = (rustc -V) -replace '[^\w.]', '-'
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            companion/src-tauri/target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('companion/src-tauri/Cargo.lock') }}
          # A lockfile change usually moves a handful of crates, so an older
          # target directory still saves most of the compile.
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      # tauri::generate_context!() embeds companion/dist at compile time, so
      # every cargo step below needs the frontend built first. dist/ is
      # gitignored, so a fresh runner has to build it here — companion-web's
      # copy lives in a different job and never reaches this one.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install companion dependencies
        working-directory: companion
        run: npm ci
      - name: Build companion frontend
        working-directory: companion
        run: npm run build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
